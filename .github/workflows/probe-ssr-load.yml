name: Probe SSR load
on:
  push:
    branches: [probe/ssr-load]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: '.nvmrc'
      - run: nproc; lscpu | head -20; free -g; docker --version; sudo apt-get install -y -qq strace >/dev/null
      - run: pnpm install --frozen-lockfile --filter @framework-tracker/stats-generator...
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: packages/app-solid
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: packages/app-solid-start
      - run: .probe/run.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: probe
          path: .probe/out
